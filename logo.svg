<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#5ba3d0" stroke-width="2"/>
  
  <!-- Left waveform -->
  <g stroke="#5ba3d0" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 50 100 Q 60 80 70 100 Q 80 120 90 100"/>
    <path d="M 60 100 Q 70 70 80 100 Q 90 130 100 100"/>
    <path d="M 70 100 Q 80 85 90 100 Q 100 115 110 100"/>
  </g>
  
  <!-- Center play/sound symbol -->
  <circle cx="100" cy="100" r="20" fill="none" stroke="#5ba3d0" stroke-width="2.5"/>
  <polygon points="95,90 95,110 115,100" fill="#5ba3d0"/>
  
  <!-- Right waveform -->
  <g stroke="#5ba3d0" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 110 100 Q 120 80 130 100 Q 140 120 150 100"/>
    <path d="M 100 100 Q 110 70 120 100 Q 130 130 140 100"/>
    <path d="M 90 100 Q 100 85 110 100 Q 120 115 130 100"/>
  </g>
</svg>